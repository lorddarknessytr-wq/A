name: Test Rubika Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile bot_core.py run_bot.py

      - name: Run bot manually
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          GITHUB_EVENT_NAME: workflow_dispatch
        run: python run_bot.py

      - name: Save bot database
        if: always()
        run: |
          if [ -f rubika_bot.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rubika_bot.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: update rubika bot state"
              git push
            fi
          fi
