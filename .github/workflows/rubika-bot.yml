name: Rubika Mod Bot

on:
  schedule:
    # هر ساعت، از ۷:۳۰ تا ۱۹:۳۰ UTC  =  ۱۱:۰۰ تا ۲۳:۰۰ به وقت تهران
    - cron: "30 7-19 * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions در گیت‌هاب

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect new mods/videos from source channel
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: python collect_mods.py

      - name: Post scheduled content to destination channels
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: python post_scheduler.py

      - name: Save updated state.json back to the repo
        run: |
          git config user.name "rubika-mod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git push
