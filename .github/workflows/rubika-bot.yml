name: Rubika Bot Auto-Run

on:
  schedule:
    - cron: '*/5 * * * *' # اجرا به صورت خودکار هر ۴ دقیقه
  workflow_dispatch: # فعال نگه داشتن دکمه Run workflow برای اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # دادن دسترسی به اکشن برای کامیت کردن تغییرات وضعیت روی ریپازیتوری
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # در صورت نیاز ورژن پایتون خود را تغییر دهید

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rubika-mod-bot/requirements.txt

      - name: Run Bot (Process Messages)
        # فرض بر این است که ربات اجرا می‌شود، کارش را می‌کند و با موفقیت بسته می‌شود
        run: |
          cd rubika-mod-bot
          python run_bot.py

      - name: Commit and push state changes
        # این بخش تغییرات فایل state.json را روی گیت‌هاب شما ذخیره می‌کند
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rubika-mod-bot/state.json
          # فقط در صورتی که فایل تغییر کرده باشد کامیت انجام می‌شود تا باگ ایجاد نشود
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update state.json" && git push)
