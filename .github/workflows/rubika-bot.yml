name: Rubika Bot Auto-Run

on:
  schedule:
    - cron: '*/5 * * * *' # اجرا به صورت خودکار هر ۸ دقیقه
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (Process Messages)
        run: |
          python run_bot.py

      - name: Commit and push state changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update state.json" && git push)
